# STM32G071CBU3 + CMSIS-DAP over SWD.
# Select the probe verified on this board; another connected probe fails CMD_INFO.
source [find interface/cmsis-dap.cfg]
cmsis-dap backend hid
adapter serial b79c4c58
transport select swd
source [find target/stm32g0x.cfg]

adapter speed 1000
# Use SYSRESETREQ; NRST wiring is optional for this configuration.
reset_config none
cortex_m reset_config sysresetreq

# Override the stock G0 hooks: keep HSI16 and 1 MHz SWD during programming.
# The default reset-init hook enables the PLL and switches to 64 MHz.
$_TARGETNAME configure -event reset-start { adapter speed 1000 }
$_TARGETNAME configure -event reset-init { adapter speed 1000 }
